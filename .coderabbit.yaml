# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"
  path_filters:
    - "!**/*.lock"
    - "!**/*.log"
    - "!**/*.apk"
    - "!android-builds/**"
    - "!frontend/krce_bus_flutter/build/**"
    - "!**/node_modules/**"
  tools:
    ast-grep:
      enabled: true
    shellcheck:
      enabled: true
    ruff:
      enabled: true
chat:
  auto_reply: true
